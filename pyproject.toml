[project]
name = "clinical-rag-eval-harness"
version = "1.0.0"
description = "Eval + regression harness for LLM clinical document extraction and retrieval"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=harness --cov-report=term-missing"
